version: '3.8'

services:
  alternup:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    restart: unless-stopped
    volumes:
      # En développement, vous pouvez monter le volume pour le hot reload
      # - .:/app
      # - /app/node_modules
      - alternup_data:/app/data

volumes:
  alternup_data:

networks:
  default:
    name: alternup-network